<div id="container" class="card" data-signals="{formId: 'configfeed'}">
    <div class=" header">
        <h1>Select RSS Feeds</h1>
    </div>

    <div class="table-container">
        <table class="feedtable">
            <thead>
                <tr>
                    <th width="500px">Feed-Name</th>
                    <th width="60px">Enabled</th>
                </tr>
            </thead>
            <!-- The backend will target this ID to insert rows -->
            <tbody id="feed-table" data-effect="@get('/get-feeds')"></tbody>
        </table>
    </div>
</div>
