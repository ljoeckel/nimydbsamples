<div id="container" class="card" data-signals="{formId: 'configfeed'}">
    <style>

        .table tbody tr.marked {
            font-weight: 800;
        }

        .table tbody tr {
            font-weight: 300;
        }

        .selectall {
            color: darkorange;
        }

        .table td.feedgroup-full {
            color: lightseagreen;
            font-weight: 600;
        }

        .table td.feedgroup-partial {
            color: lightblue;
            font-weight: 600;

        }

        .table td.feedgroup-empty {
            color: lightgray;
        }

        .table a:link {
            text-decoration: none;
        }
        .table a:hover {
            text-decoration: underline;
            cursor: pointer;
        }
    </style>


    <div class="header">
        <h1 class="subtitle mt-2 mb-2">Select the RSS Feeds</h1>
    </div>    
    
    <table class="table is-narrow is-hoverable">
        <thead class="table-secondary">
            <tr>
                <th>
                    <button title="Select/Deselect all RSS feeds" class="selectall"
                        data-on:click__stop="$id='ALL'; @post('/toggle-feed')">
                        <i class="bi bi-square"></i>
                    </button>
                </th>
                <th width="70%">RSS Feed</th>
            </tr>
        </thead>

        <!-- The backend will target this ID to insert rows -->
        <tbody id="feed-table" data-effect="@post('/get-feeds')"></tbody>
    </table>

</div>
