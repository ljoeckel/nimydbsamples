<!DOCTYPE html>
<html>

<!-- head data-init="@get('/update-clock')"-->
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow" />
    <script type="module"
        src="https://cdn.jsdelivr.net/gh/starfederation/datastar@1.0.0-RC.8/bundles/datastar.js"></script>
    <link rel="stylesheet" href="/reset.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/table.css">
    <link rel="stylesheet" href="/card.css">
    <link rel="stylesheet" href="/login.css">
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="formfields.js"></script>
    <script src="formfields_country.js"></script>
    <script src="helpers.js"></script>

</head>

<body data-signals="{formId:'index', userid:'', password:''}">
    <!-- The navigation menu -->
    <div class="navbar">
        <a href="#about" data-on:click="$menuOpen = false; @get('/about.html')"></a>
    </div>

    <div class="login-container">
        <form class="login-form" data-on:submit__prevent="@post('/login')">
            <h2 class="login-title">Welcome to 'Nimetic'</h2>
            <p class="login-subtitle">Login please</p>

            <div class="login-group">
                <input 
                    data-bind:userid
                    type="text"
                    class="login-input"
                    placeholder="Username"
                    required
                >
            </div>
            <div class="login-group">
                <input
                    data-bind:password
                    type="password"
                    class="login-input"
                    placeholder="Password"
                    required
                >
            </div>

            <button type="submit" class="login-btn login-btn--primary">Login</button>

            <div class="login-divider">or</div>

            <button type="button" class="login-btn login-btn--secondary">Register</button>
        </form>
    </div>

</body>

</html>
