<!DOCTYPE html>
<html class="has-navbar-fixed-top" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="/bulma.min.css">
    <!--link rel="stylesheet" href="/bulmaswatch-slate.min.css"-->
    <!--link rel="stylesheet" href="/bulmaswatch-materia.min.css"-->
    
    <script type="module" src="/datastar.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/6.0.0/echarts.min.js"></script>
    <script src="dbcharts.js"></script>

    <link rel="stylesheet" href="/root.css">
    <script src="formfields.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="/favicon.ico" />
</head>


<body    
    data-signals="{formId:'index', userid:'', password:'', loggedIn: false, action: '', burgerOpen: false, menuOpen: false, ydbMenuOpen: false}">
    <nav class="navbar is-fixed-top" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a class="navbar-item" data-show="$loggedIn"
                data-on:click="$rssOpen=!$rssOpen; $burgerOpen=false; @post('/livefeed.html')">
                <img src="rss.png" height="20" width="20" alt="RSS Icon">
                Live
            </a>

            <a class="navbar-item" title="Login" data-show="!$loggedIn && $formId == 'about'"
                data-on:click="rssOpen=!$rssOpen; $burgerOpen=false; @post('/index.html')">
                <i class="bi bi-box-arrow-in-right"></i>
                Login
            </a>

            <a class="navbar-item" title="About" data-show="!$loggedIn"
                data-on:click="rssOpen=!$rssOpen; $burgerOpen=false; @post('/about.html')">
                <i class="bi bi-question-circle"></i>
            </a>

            <a class="navbar-item" title="Feed configuration" data-show="$loggedIn"
                data-show="$loggedIn"
                data-on:click="$menuOpen=false; $burgerOpen=false; @post('configfeeds.html')">
                <i class="bi bi-gear"></i>
            </a>

            <a class="navbar-item" title="News Trend" data-show="$loggedIn" 
                data-on:click="$burgerOpen=false; @post('wordcloud.html')"
                title='Show the latest Word-Cloud'>
                <i class="bi bi-graph-up-arrow"></i>
            </a>

            <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbarBasicExample"
                data-show="$loggedIn" data-on:click="$burgerOpen=!$burgerOpen" data-class:is-active="$burgerOpen">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </a>
        </div>      

        <div id="navbarFull" class="navbar-menu" data-class:is-active="$burgerOpen">
            <div class="navbar-start">
                <div class="navbar-item has-dropdown"
                    data-show="$loggedIn"
                    data-class:is-active="$ydbMenuOpen"
                    data-on:click="$ydbMenuOpen = !$ydbMenuOpen"
                    data-on:mouseenter="$ydbMenuOpen=true"
                    data-on:mouseleave="$ydbMenuOpen=false">

                    <a class="navbar-link">
                        <i class="bi bi-database"></i>
                        Status
                    </a>
                    <div class="navbar-dropdown">
                        <a class="navbar-item" title="Count the Order Keys"
                            data-on:click="$burgerOpen=false; $action='keys'; @post('stats.html')">
                            <i class="bi bi-bar-chart"></i> Keycount</a>
                        <a class="navbar-item" title="Full Global Scan"
                            data-on:click="$burgerOpen=false; $action='full'; @post('stats.html')">
                            <i class="bi bi-bar-chart-fill"></i> Full Scan</a>
                        <a class="navbar-item" title="Monitor database in RealTime"
                            data-on:click="$burgerOpen=false; @post('dbmon.html')">
                            <i class="bi bi-activity"></i> Monitor</a>
                        <a class="navbar-item" title="List the YottaDB globals"
                            data-on:click="$burgerOpen=false; @post('dbedit.html')">
                            <i class="bi bi-pencil"></i> Globals</a>
                        <a class="navbar-item" title="YottaDB Database performance charts"
                            data-on:click="$burgerOpen=false; @post('dbcharts.html')">
                            <i class="bi bi-graph-up"></i> Statistics</a>
                        <a class="navbar-item" title="File Explorer"
                            data-on:click="$burgerOpen=false; @post('explorer.html')">
                            <i class="bi bi-folder2"></i> Explorer</a>
                    </div>
                </div>

                <!-- Der INFO placeholder -->
                <a class="navbar-item info" data-show="$loggedIn">
                    <p id="info"></p>
                </a>
            </div>
                

            <div class="navbar-end">
                <a class="navbar-item info" data-show="$loggedIn">
                    <p id="wallclock"></p>
                </a>

                <a class="navbar-item" title="About" data-show="$loggedIn"
                    data-on:click="rssOpen=!$rssOpen; $burgerOpen=false; @post('/about.html')">
                    <i class="bi bi-question-circle"></i>
                </a>

                <a class="navbar-item" data-show="$loggedIn" data-attr:title="$userid"
                    data-on:click="$menuOpen=false; $burgerOpen=false; @post('/edit-registration')">
                    <i class="bi bi-person-lines-fill"></i>
                </a>
                <a class="navbar-item" title="Logout" data-show="$loggedIn"
                    data-on:click="$menuOpen=false; $burgerOpen=false; @post('/logout')">
                    <i class="bi bi-box-arrow-right"></i>
                </a>

            </div>
        </div>
    </nav>

    <!-- 'container' is the placeholder for content -->
     <div class="mt-0 ml-3">
        <div id="container" data-init="@post('./html/login.html')"></div>
    </div>

</body>

</html>
