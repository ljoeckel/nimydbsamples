<!DOCTYPE html>
<html>

<!-- head data-init="@get('/update-clock')"-->
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="/reset.css">

<body data-signals="{formId:'index', userid:'', password:'', loggedIn: false}">
    <!-- The navigation menu -->
    <div class="navbar">
        <div class="subnav" data-show="$loggedIn">
            <a href="#home" id="home" data-on:click="@get('/livefeed.html')"
                style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none;">
                <img src="rss.png" height="20" width="20" alt="RSS Icon">

            </a>
        </div>

        <a href="#feeds" data-show="$loggedIn"  data-on:click="$menuOpen = false; @get('goto/configfeeds.html')">Feeds</a>

            </div>
        </div>
