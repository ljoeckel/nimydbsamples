<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow" />
    <!--script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.1/bundles/datastar.js"></script-->
    <script type="module" src="/datastar.js"></script>
    <script src="formfields.js"></script>
    <link rel="stylesheet" href="/reset.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/table.css">
    <link rel="stylesheet" href="/card.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="/favicon.ico" />

</head>

<style>
    .navbar {
        display: flex;
        align-items: center;
        background-color: var(--nav-bar);
        position: relative;
    }

    /* For #clock field */
    .navbar h3 {
        margin-left: auto;
        font-size: 14px;
        color: rgb(159, 178, 196);
        padding: 14px 16px;
        margin-top: 0;
        margin-bottom: 0;
    }

    /* Navigation without submenu */
    .navbar a {
        font-size: 16px;
        color: var(--nav-fg);
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
    }

    .subnav {
        position: relative;
    }

    .subnav .subnavbtn {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        border: none;
        color: var(--nav-fg);
        padding: 14px 16px;
        background-color: inherit;
        cursor: pointer;
        height: 100%;
        /* Matches parent height */
    }

    /* Add a red background color to navigation links on hover */
    .navbar a:hover,
    .subnav:hover,
    .subnav:hover .subnavbtn {
        background-color: var(--nav-bg);
    }

    .subnav-content {
        display: none;
        position: absolute;
        top: 100%;
        /* Aligns precisely with the bottom of the stretched navbar */
        right: 0;
        /* Aligns the dropdown flush to the RIGHT edge of the icon */
        background-color: var(--nav-bg);
        width: max-content;
        z-index: 1000;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        /* Optional: adds depth to the dropdown */
    }

    .subnav-content a {
        display: block;
        /* Changed from float:left to stack options vertically */
        color: var(--nav-fg);
        padding: 12px 16px;
        /* Gives items a good clickable hit-area */
        text-decoration: none;
        text-align: left;
    }

    .subnav-content a:hover {
        text-decoration: underline;
        text-decoration-style: double;
    }

    /* When you move the mouse over the subnav container, open the subnav content */
    .subnav:hover .subnav-content {
        display: block;
    }
</style>

<body data-signals="{formId:'index', userid:'', password:'', loggedIn: false, menuOpen: false}">
    <!-- The navigation menu -->
    <div class="navbar">
        <div class="subnav" data-show="$loggedIn">
            <a href="#livefeed" id="home" data-on:click="@get('/livefeed.html')"
                style="display: inline-flex; align-items: center; gap: 4px; text-decoration: none;">
                <img src="rss.png" height="20" width="20" alt="RSS Icon">
                Live
            </a>
        </div>

        <a href="#wordcloud" data-show="$loggedIn"  data-on:click="$menuOpen = false; @get('goto/wordcloud.html')" title='Show the latest Word-Cloud'><i class="bi bi-radar"></i></a>
        <a href="#stats" title="Database Statistics" data-show="$loggedIn"  data-on:click="$menuOpen = false; @get('goto/stats.html')"><i class="bi bi-database"></i></a>

        <a href="#about" data-on:click="$menuOpen = false; @get('/about.html')" title="About"><i class="bi bi-question-circle"></i></a>
        <a href="#login" data-show="!$loggedIn" data-on:click="$menuOpen = false; @get('/index.html')"><i class="bi bi-box-arrow-in-right"></i> Login</a>        

        <div class="subnav" 
            data-show="$loggedIn" 
            data-on:mouseenter="$menuOpen = true" 
            data-on:mouseleave="$menuOpen = false">
            <button class="subnavbtn" data-attr:title="'You are logged in as: ' + $userid">
                <i class="bi bi-person-circle"></i>
            </button>
            <div class="subnav-content" data-show="$menuOpen">
                <a href="#feeds" title="Feed Configuration" data-on:click="$menuOpen = false; @get('goto/configfeeds.html')"><i class="bi bi-gear"></i> Configuration</a>
                <a href="#edit" data-on:click="$menuOpen = false; @get('/edit-registration')"><i class="bi bi-person-lines-fill"></i> Edit Profile</a>
                <a href="#logout" data-on:click="$menuOpen = false; @get('/logout')"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </div>
        <!-- placeholders for the 'info' field (Query time etc.) -->
        <h3 id="info"></h3>
        
        <!-- placeholder for the wallclock -->
        <h3 id="wallclock"></h3>
    </div>

    <!-- 'container' is the placeholder for content -->
    <div id="container" data-init="@get('/login.html')"></div>
</body>

</html>
