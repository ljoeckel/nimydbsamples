<div id="container" data-signals="{
        formId: 'explorer',
        dir: '/home/ljoeckel/git',
        isOpen: false,
        showMenu: false,
        menuX: 0,
        menuY: 0
        }">

    <style>
        /* Grundaufbau der Liste */
        .tree,
        .tree ul {
            list-style: none;
            margin: 0;
            padding: 0;
            font-family: "Noto Sans Mono CJK", "DejaVu Sans Mono", "Roboto Mono", monospace;
        }

        .tree ul {
            margin-left: 1em;
            /* Einrückung der Unterebenen */
            position: relative;
        }

        /* Vertikale Verbindungslinien */
        .tree ul::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            border-left: 1px solid #ccc;
        }

        /* Einzelne Listeneinträge */
        .tree li {
            margin: 0;
            padding: 0 1.5em;
            /* Platz für die horizontalen Linien */
            line-height: 1.25em;
            position: relative;
        }

        /* Horizontale Verbindungslinien zu den Elementen */
        .tree li::before {
            content: "";
            position: absolute;
            top: 1em;
            left: 0;
            width: 1em;
            border-top: 1px solid #ccc;
        }

        /* Entfernt die überstehende vertikale Linie am letzten Element */
        .tree li:last-child::before {
            background: #fff;
            /* Muss der Hintergrundfarbe der Seite entsprechen */
            height: auto;
            top: 1em;
            bottom: 0;
        }

        /* Styling für die klickbaren Ordner-Überschriften */
        .tree summary {
            cursor: pointer;
            /*font-weight: bold;*/
            color: darkblue;
            outline: none;
        }

        /* Standard-Browserpfeil verstecken (Chrome/Safari & Firefox) */
        .tree summary::-webkit-details-marker {
            display: none;
        }

        .tree summary {
            list-style: none;
        }

        /* Eigenes Icon für geöffneten/geschlossenen Zustand (optional) */
        .tree summary::marker {
            display: none;
        }

        .tree summary::before {
            content: "📁 ";
            margin-right: 0.3em;
        }

        .tree details[open]>summary::before {
            content: "📂 ";
        }

        /* Styling für die finalen Links (Dateien) */
        .tree a {
            text-decoration: none;
            color: #333;
        }

        .tree a::before {
            content: "📄 ";
            margin-right: 0.3em;
        }

        .tree a:hover {
            text-decoration: underline;
        }


        .context-menu {
            position: absolute;
            background-color: #ffffff;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            padding: 5px 0;
            margin-top: 12px;
            min-width: 150px;
            z-index: 1000;
            font-family: sans-serif;
        }

        .menu-item {
            padding: 8px 12px;
            cursor: pointer;
        }

        .menu-item:hover {
            background-color: #f0f0f0;
        }

        /* This backdrop ensures any click outside the menu dismisses it safely */
        .menu-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999;
            /* Just below context-menu */
            background: transparent;
        }

        summary.highlight {
          /*background-color: #e2e8f0; *//* Soft gray background */
          color: #1a202c;            /* Darker text color */
          border-radius: 4px;
          padding-left: 4px;         /* Prevents text shifting if you use padding */
          font-weight: bold;
        }

    
    .tabs a:hover {
      border-bottom-color: #4a4a4a !important; 
    }
    </style>


    <div class="header" data-bind="dir">
        <h3>
            <div data-text="$dir"></div>
        </h3>
    </div>

    <!-- The context menu triggers backend server-sent events (SSE) on action click -->
    <div class="context-menu" data-show="$showMenu" data-style:left="`${$menuX}px`" data-style:top="`${$menuY}px`">
        <div class="menu-item" data-on:click="@post('/api/item/edit'); $showMenu = false"><i class="bi bi-info-square"></i> Directory info</div>
        <div class="menu-item" data-on:click="@post('/api/item/delete'); $showMenu = false"><i class="bi bi-folder-x"></i> Delete directory</div>
        <!-- hr -->
        <div class="menu-item" data-on:click="$showMenu = false"><i class="bi bi-x-circle"></i> Cancel</div>
    </div>
    <!-- Global click capture to close the menu if clicking outside of it -->
    <div data-show="$showMenu" class="menu-backdrop" data-on:click="$showMenu = false"></div>


    <div 
        data-init="@post('/api/list-globals')"
        data-on:contextmenu="
            evt.preventDefault(); 
            $menuX = evt.pageX; 
            $menuY = evt.pageY; 
            $showMenu = true;
        ">


        <!-- Will be patched via SSE from the backend -->
        <div class="tree" id="tree"></div>
    </div>

</div>
