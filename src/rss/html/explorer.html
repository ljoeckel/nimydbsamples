<div id="container" class="mt-3" data-signals="{
        formId: 'explorer',
        dir: '/home/ljoeckel/git',
        isOpen: false,
        showMenu: false,
        menuX: 0,
        menuY: 0
        }">

        <script>
        $(document).ready(function(){
            $('[data-toggle="tooltip"]').tooltip();
        });
        </script>


    <style>
        :root {
            --border-color: var(--bulma-grey-light);
            --folder-color: var(--bulma-info);
            --text-color: white;
            --menu-color: darkblue;
            --menu-background-color: darkgray;
            --menu-background-hover: lightgray;
            --menu-color-hover: black;
            --background-active: var(--bulma-background-active);
        }


        /* Grundaufbau der Liste */
        .tree,
        .tree ul {
            list-style: none;
            margin: 0;
            padding: 0;
            font-family: "Noto Sans Mono CJK", "DejaVu Sans Mono", "Roboto Mono", monospace;
        }

        .tree ul {
            margin-left: 1em;
            /* Einrückung der Unterebenen */
            position: relative;
        }

        /* Vertikale Verbindungslinien */
        .tree ul::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            border-left: 1px solid var(--border-color);
        }

        /* Einzelne Listeneinträge */
        .tree li {
            margin: 0;
            padding: 0 1em;
            /* Platz für die horizontalen Linien */
            line-height: 1.15em;
            /*line-height: 1.25em;*/
            position: relative;
            color: var(--text-color);
        }

        /* Horizontale Verbindungslinien zu den Elementen */
        .tree li::before {
            content: "";
            position: absolute;
            top: 0.5em;
            left: 0;
            width: 0.75em;
            border-top: 1px solid var(--border-color);
        }

      
        /* Entfernt die überstehende vertikale Linie am letzten Element */
        .tree li:last-child::before {
            color: var(--background-color);
            height: auto;
            top: 1em;
            bottom: 0;
            border-top: 1px solid var(--background-color);
        }

        /* Styling für die klickbaren Ordner-Überschriften */
        .tree summary {
            cursor: pointer;
            color: var(--folder-color);
            outline: none;
            list-style: none;
        }
        
        /* Standard-Browserpfeil verstecken (Chrome/Safari & Firefox) */
        .tree summary::-webkit-details-marker {
            display: none;
        }

        /* Eigenes Icon für geöffneten/geschlossenen Zustand (optional) */
        .tree summary::marker {
            display: none;
        }

        .tree summary::before {
            content: "📁";
            margin-right: 0.25em;
        }

        .tree details[open]>summary::before {
            content: "📂";
        }

        /* Styling für die finalen Links (Dateien) */
        .tree a {
            text-decoration: none;
            color: var(--text-color);
        }

        .tree a::before {
            content: "📄";
            margin-right: 0.25em;
        }

        .tree a:hover {
            text-decoration: underline;
        }

        .tree tr {
            color: var(--text-color);
            background-color: #272b30;
            line-height: 1em;
        }

        .context-menu {
            position: absolute;
            background-color: var(--menu-background-color);
            color: var(--menu-color);
            border: 2px solid #ccc;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            padding: 5px 0;
            margin-top: 0px;
            min-width: 150px;
            z-index: 1000;
            font-family: sans-serif;
        }

        .menu-item {
            padding: 8px 12px;
            cursor: pointer;
        }

        .menu-item:hover {
            background-color: var(--menu-background-hover);
            color: var(--menu-color-hover);
        }

        /* This backdrop ensures any click outside the menu dismisses it safely */
        .menu-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999;
            background: transparent;
        }
        
        summary.highlight {
          font-weight: bold;
        }
        
    /*
    .tabs a:hover {
      border-bottom-color: #4a4a4a !important; 
      border-bottom-color: red !important; 
    }
      */

    </style>


    <div class="header mb-3" data-bind="dir">
        <h3>
            <div data-text="$dir"></div>
        </h3>
    </div>

    <!-- The context menu triggers backend server-sent events (SSE) on action click -->
    <div class="context-menu" data-show="$showMenu" data-style:left="`${$menuX}px`" data-style:top="`${$menuY}px`">
        <div class="menu-item" data-on:click="@post('/api/item/edit'); $showMenu = false"><i class="bi bi-info-square"></i> Directory info</div>
        <div class="menu-item" data-on:click="@post('/api/item/delete'); $showMenu = false"><i class="bi bi-folder-x"></i> Delete directory</div>
        <!-- hr -->
        <div class="menu-item" data-on:click="$showMenu = false"><i class="bi bi-x-circle"></i> Cancel</div>
    </div>
    <!-- Global click capture to close the menu if clicking outside of it -->
    <div data-show="$showMenu" class="menu-backdrop" data-on:click="$showMenu = false"></div>

    <div 
        data-init="@post('/api/list-globals')"
        data-on:contextmenu="
            evt.preventDefault(); 
            $menuX = evt.pageX; 
            $menuY = evt.pageY; 
            $showMenu = true;
        ">

        <!-- Will be patched via SSE from the backend -->
        <div class="tree" id="tree"></div>

    </div>

</div>
