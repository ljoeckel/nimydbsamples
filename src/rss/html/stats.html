<div id="container" class="card">
    
    <div class="header">
        <h1>Database statistics</h1>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th align="left" width="250px">Global</th>
                    <th align="right" width="100px">Order #</th>
                    <th align="right" width="100px">Query #</th>
                    <th align="right" width="100px">Duration</th>
                    <th align="right" width="30px"></th>
                </tr>
            </thead>
            <!-- The backend will target this ID to insert rows -->
            <tbody id="stats-body" data-init="@get('/get-stats')"></tbody>
        </table>
    </div>
</div>
