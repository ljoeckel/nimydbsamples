<div id="container"
    data-signals="{
        domain: 'srv',
        period: 'Hour',
        chartType: 'line',
        chart1: { id: 'chart1', mnemonic: 'GET', x: [], y: [] },
        chart2: { id: 'chart2', mnemonic: 'SET', x: [], y: [] },
        chart3: { id: 'chart3', mnemonic: 'ORD', x: [], y: [] },
        chart4: { id: 'chart4', mnemonic: 'QRY', x: [], y: [] }
    }">

    <div data-init="@post('/chart1'); @post('/chart2'); @post('/chart3'); @post('/chart4')">
        <div class="select-group">
            <div class="select-group">
                <label for="domain">Process:</label>
                <select id="domain" data-bind="domain" 
                    data-indicator="isLoading"
                    data-on:change="@post('/chart1'); @post('/chart2'); @post('/chart3'); @post('/chart4')">
                    <option value="srv">RSSServer</option>
                    <option value="clc">RSSCollector</option>
                </select>
            </div>
            <div class="select-group">
                <label for="period">Timerange:</label>
                <select id="period" data-bind="period" 
                    data-indicator="isLoading"
                    data-on:change="@post('/chart1'); @post('/chart2'); @post('/chart3'); @post('/chart4')">
                    <option value="Hour">Hour by minute</option>
                    <option value="Day">Day by hour</option>
                    <option value="Week">Week by day</option>
                    <option value="Month">Month by day</option>
                    <option value="YearByDay">Year by day</option>
                    <option value="YearByMonth">Year by month</option>
                    <option value="All">All datapoints</option>
                </select>
            </div>                
            <div class="select-group">
                <label for="chartType">Charttype:</label>
                <select id="chartType" data-bind="chartType" 
                    data-indicator="isLoading"
                    data-on:change="@post('/chart1'); @post('/chart2'); @post('/chart3'); @post('/chart4')">
                    <option value="line">Line</option>
                    <option value="bar">Bar</option>
                    <option value="scatter">Scatter</option>
                </select>
            </div>
            <svg data-show="$isLoading" width="5" height="5">
                <circle cx="3" cy="3" r="3" fill="red" />
            </svg>
            <svg data-show="!$isLoading" width="5" height="5">
            </svg>
        </div>
    </div>

    <div id="chart1" style="width: 100vw; height: 20vh;" data-effect="window.updateChart($chart1, $chartType)"></div>
    <div id="chart2" style="width: 100vw; height: 20vh;" data-effect="window.updateChart($chart2, $chartType)"></div>
    <div id="chart3" style="width: 100vw; height: 20vw;" data-effect="window.updateChart($chart3, $chartType)"></div>
    <div id="chart4" style="width: 100vw; height: 20vw;" data-effect="window.updateChart($chart4, $chartType)"></div>
    
</div>
