<div id="container"
    data-signals="{
        chart1: { id: 'chart1', mnemonic: 'GET', domain: 'srv', x: [], y: [], processed: 123 },
        chart2: { id: 'chart2', mnemonic: 'SET', domain: 'srv', x: [], y: [], processed: 456 },
        chart3: { id: 'chart3', mnemonic: 'ORD', domain: 'srv', x: [], y: [], processed: 456 },
        chart4: { id: 'chart4', mnemonic: 'QRY', domain: 'srv', x: [], y: [], processed: 456 },
    }">

    <div id="chart1" style="width: 100%; height: 200px;"></div>
    <div id="chart2" style="width: 100%; height: 200px;"></div>
    <div id="chart3" style="width: 100%; height: 200px;"></div>
    <div id="chart4" style="width: 100%; height: 200px;"></div>
    
    <div 
        data-init="@post('chart1')"
        data-effect="window.updateChart($chart1.id, $chart1.mnemonic, $chart1.domain, $chart1.x, $chart1.y)">
    </div>

    <div 
        data-init="@post('/chart2')"
        data-effect="window.updateChart($chart2.id, $chart2.mnemonic, $chart2.domain, $chart2.x, $chart2.y)">
    </div>

    <div 
        data-init="@post('/chart3')"
        data-effect="window.updateChart($chart3.id, $chart3.mnemonic, $chart3.domain, $chart3.x, $chart3.y)">
    </div>

    <div 
        data-init="@post('/chart4')"
        data-effect="window.updateChart($chart4.id, $chart4.mnemonic, $chart4.domain, $chart4.x, $chart4.y)">
    </div>

</div>
