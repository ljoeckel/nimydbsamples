<div id="container"
    data-signals="{
        domain: 'srv',
        chart1: { id: 'chart1', mnemonic: 'GET', x: [], y: [] },
        chart2: { id: 'chart2', mnemonic: 'SET', x: [], y: [] },
        chart3: { id: 'chart3', mnemonic: 'ORD', x: [], y: [] },
        chart4: { id: 'chart4', mnemonic: 'QRY', x: [], y: [] },
    }">
    
    <select data-bind="domain" 
        data-init="@post('/chart1'); @post('/chart2'); @post('/chart3'); @post('/chart4')"
        data-on:change="@post('/chart1'); @post('/chart2'); @post('/chart3'); @post('/chart4')">
        <option value="srv">RSSServer</option>
        <option value="clc">RSSCollector</option>
    </select>

    <div id="chart1" style="width: 100%; height: 200px;" data-effect="window.updateChart($chart1)"></div>
    <div id="chart2" style="width: 100%; height: 200px;" data-effect="window.updateChart($chart2)"></div>
    <div id="chart3" style="width: 100%; height: 200px;" data-effect="window.updateChart($chart3)"></div>
    <div id="chart4" style="width: 100%; height: 200px;" data-effect="window.updateChart($chart4)"></div>
    
</div>
