<div id="container" data-signals="{formId: 'livefeed', lastScroll: 0, showButton: false, lastRun: 0}"
    data-signals:format__ifmissing="'card'" data-signals:direction__ifmissing="'down'"
    data-signals:sort__ifmissing="'time'" data-signals:articles__ifmissing=100 data-effect="@post('/update-clock')">
    
    <style>
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: var(--bg);
            border: 1px solid #ddd;
            /*border-radius: 8px;*/
            /* Fixierung: */
            position: sticky;
            top: 48px;
            z-index: 90;
        }

        .search-group {
            display: flex;
            flex: 1 1 300px;
            gap: 4px;
        }

        .search-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .action-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        select {
            max-width: 150px !important;
            overflow: hidden;
        }

        option {
            max-width: 120px !important;
            overflow: hidden;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 8px;
            color: black;
            background: #9fb5f1;
            border: 1px solid #3a096b;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            color: white;
            background: #334eea;
        }

        .btnhover {
            color: rgb(249, 227, 104);
            background: #0d239f;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 600px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .action-group {
                justify-content: space-between;
            }

            .divider {
                display: none;
            }
        }

        /* Back to top button */
        #backToTop {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 18px;
            background: #333;
            color: white;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            z-index: 1000;

            /* Animation */
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            /* Ignore clicks when not visible */
        }

        /* This class will be added by Datastar */
        .is-visible {
            opacity: 1 !important;
            transform: translateY(0) !important;
            pointer-events: auto !important;
        }

        /* Popover detail styling */
        .rss-detail {
            background: whitesmoke;
            border-radius: 12px;
            margin-top: 0px;
            margin-left: 0px;
            padding: 2rem;
            max-width: 100vh;
            max-height: 100vh;
            overflow-y: auto;
            overflow-x: auto;
            border: none;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .rss-detail:popover-open {
            animation: scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .rss-detail::backdrop {
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(1px);
        }

        .close-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            width: 24px;
            height: 24px;
            border: none;
            color: white;
            background: #333;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            z-index: 1000;
        }

        .close-btn:hover {
            background: darkblue;
        }


        .rssinfotable {
            border-collapse: collapse;
            table-layout: fixed;
            width: 75vw;
            /* Table fills the container */
        }

        .rssinfotable th {
            top: 0;
            background: #e4e3e3;
            color: darkslategrey;
            z-index: 10;
            border: 1px solid #ddd;
            padding: 4px;
            text-align: left;
        }

        .rssinfotable table {
            border-collapse: collapse;
            table-layout: fixed;
            width: 100%;
        }

        .rssinfotable thead tr {
            background: #3b82f6;
            color: #ffffff;
            text-align: left;
        }

        .rssinfotable td {
            border: 1px solid #ddd;
            padding: 6px;
            overflow-wrap: break-word;
            white-space: normal;
            text-align: left;
        }

        .rssinfotable tbody tr {
            font-size: 14px;
            color: black;
        }      
    </style>

    <div class="toolbar" id="main_toolbar" data-effect="@post('/search')">
        <!-- Search -->
        <div class="search-group">
            <!-- Keyword -->
            <input type="search" placeholder="Search..." id="keyword" data-bind:keyword
                data-on:input__debounce.500ms="@post('/search')" autofocus />
            <!-- Number of results -->
            <select id="articles" name="articles" data-bind:articles autocomplete="articles"
                data-on:change__delay.100ms="@post('/search')">
                <option>10</option>
                <option>25</option>
                <option>50</option>
                <option>75</option>
                <option>100</option>
                <option>150</option>
                <option>250</option>
                <option>500</option>
                <option>1000</option>
                <option>2500</option>
                <option>5000</option>
            </select>
        </div>

        <!-- horizontal divider between # of results and first button -->
        <div class="divider" style="width: 1px; height: 25px; background: #ddd;"></div>

        <div class="action-group">
            <!-- Today -->
            <button class="btn" title="Today only" data-class:btnhover="$sort == 'today'"
                data-on:click="$sort='today'; @post('/search')">
                <i class="bi bi-calendar-event"></i>
            </button>

            <!-- All days -->
            <button class="btn" title="All days" data-class:btnhover="$sort == 'time'"
                data-on:click="$sort='time'; @post('/search')">
                <i class="bi bi-calendar-week"></i>
            </button>

            <!-- Relevanz -->
            <button class="btn" title="By Relevance" data-attr:disabled="!$keyword"
                data-class:btnhover="$sort == 'relevance'" data-on:click="$sort='relevance'; @post('/search')">
                <i class="bi bi-graph-down"></i>
            </button>
            
            <!-- Spacer -->
            <div style="width: 6px;"></div>

            <!-- List as Cards -->
            <button class="btn" title="Show Cards" data-class:btnhover="$format == 'card'"
                data-on:click="$format='card'; @post('/search')">
                <i class="bi bi-postcard"></i>
            </button>

            <!-- List Headline -->
            <button class="btn" title="Show as List" data-class:btnhover="$format == 'list'"
                data-on:click="$format='list'; @post('/search')">
                <i class="bi bi-list"></i>
            </button>

            <!-- Spacer -->
            <div style="width: 6px;"></div>

            <!-- Sort -->
            <button class="btn" title="Oldest first" data-attr:disabled="!$keyword"
                data-class:btnhover="$direction == 'up'" data-on:click="$direction='up'; @post('/search')">
                <i class="bi bi-sort-up"></i>
            </button>
            <button class="btn" title="Youngest first" data-attr:disabled="!$keyword"
                data-class:btnhover="$direction == 'down'" data-on:click="$direction='down'; @post('/search')">
                <i class="bi bi-sort-down-alt"></i>
            </button>
        </div>

        <!-- Scroll to top button -->
        <button id="backToTop" data-class="{ 'is-visible': $showButton }"
            data-on:click="window.scrollTo({top: 0, behavior: 'smooth'})">
            ↑ Go to top
        </button>
        <!-- Scroll to top controlling -->
        <div
            data-on:scroll__window__debounce.300ms="$showButton = (window.scrollY < $lastScroll && window.scrollY > 300); $lastScroll = window.scrollY; @post('/update-scroll')">
        </div>
    </div>


        <!-- RSS Detail Popover -->
        <div id="rss-detail" class="rss-detail" popover>
            <button class="close-btn" popovertarget="rss-detail" popovertargetaction="hide">
                ✕
            </button>
            <table class="rssinfotable">
                <thead>
                    <tr>
                        <th align="left" width="120px">Field</th>
                        <th align="right" width="500px"></th>
                    </tr>
                </thead>
                <tbody id="rssinfo"></tbody>
            </table>
        </div>


        <!-- Placeholder for Cards or List -->
        <div id="rsscards" class="rsscard-container"></div>

    </div>
