<div id="container" data-signals="{formId: 'livefeed', lastScroll: 0, showButton: false, lastRun: 0}"
    data-signals:format__ifmissing="'card'" data-signals:direction__ifmissing="'down'"
    data-signals:sort__ifmissing="'time'" data-signals:articles__ifmissing=100 data-effect="@post('/update-clock')">
    
    <nav class="level mt-3">
        <div class="level-left">
            <div class="field has-addons">
                <div class="control">
                    <input class="input level-item" type="search" placeholder="Search..." id="keyword" data-bind:keyword
                        data-on:input__debounce.500ms="@post('/search')" autofocus />
                </div>

                <select class="level-item ml-1" id="articles" name="articles" data-bind:articles autocomplete="articles"
                    data-on:change__delay.100ms="@post('/search')">
                    <option>10</option><option>25</option><option>50</option><option>100</option>
                    <option>250</option><option>500</option><option>1000</option>
                    <option>2000</option><option>5000</option>
                </select>
            </div>
        </div>

        <div class="level-right">
            <div class="field has-addons">
                <div class="field has-addons mb-0">
                    <button class="button is-info is-light is-small" title="Today only" data-class:is-active="$sort == 'today'"
                        data-on:click="$sort='today'; @post('/search')">
                        <i class="bi bi-calendar-event"></i>
                    </button>
                    <button class="button is-info is-light is-small" title="All days" data-class:is-active="$sort == 'time'"
                        data-on:click="$sort='time'; @post('/search')">
                        <i class="bi bi-calendar-week"></i>
                    </button>
                    <button class="button is-light is-small" title="By Relevance" data-class:is-active="$sort == 'relevance'" data-attr:disabled="!$keyword"
                        data-class:is-info="$keyword"
                        data-on:click="$sort='relevance'; @post('/search')">
                        <i class="bi bi-graph-down"></i>
                    </button>
                </div>
            
                <div class="divider" style="width: 10px; height: 1px; background: inherit;"></div>
            
                <div class="field has-addons mb-0">
                    <button class="button is-link is-light is-small" title="Show Cards" data-class:is-active="$format == 'card'"
                        data-on:click="$format='card'; @post('/search')">
                        <i class="bi bi-postcard"></i>
                    </button>
                    <button class="button is-link is-light is-small" title="Show as List" data-class:is-active="$format == 'list'"
                        data-on:click="$format='list'; @post('/search')">
                        <i class="bi bi-list"></i>
                    </button>
                </div>
            
                <div class="divider" style="width: 10px; height: 1px; background: inherit;"></div>

                <div class="field has-addons mb-0 mr-3">
                    <button class="button is-light is-small" title="Oldest first" data-attr:disabled="!$keyword" data-class:is-active="$direction == 'up'"
                        data-class:is-success="$keyword"
                        data-on:click="$direction='up'; @post('/search')">
                        <i class="bi bi-sort-up"></i>
                    </button>
                    <button class="button is-light is-small" title="Youngest first" data-attr:disabled="!$keyword" data-class:is-active="$direction == 'down'"
                        data-class:is-success="$keyword"
                        data-on:click="$direction='down'; @post('/search')">
                        <i class="bi bi-sort-down-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div>
        <!-- Scroll to top button -->
        <button id="backToTop" data-class="{ 'is-visible': $showButton }"
            data-on:click="window.scrollTo({top: 0, behavior: 'smooth'})">
            ↑ Go to top
        </button>
        <!-- Scroll to top controlling -->
        <div
            data-on:scroll__window__debounce.200ms="$showButton = (window.scrollY < $lastScroll && window.scrollY > 300); $lastScroll = window.scrollY; @post('/update-scroll')">
        </div>
    </div>


    <!-- RSS Detail Popover -->
    <div id="rss-detail" class="rss-detail" popover>
        <button class="close-btn" popovertarget="rss-detail" popovertargetaction="hide">
            ✕
        </button>
        <table class="rssinfotable">
            <thead class="table-secondary">
                <tr>
                    <th align="left" width="120px">Field</th>
                    <th align="right" width="500px"></th>
                </tr>
            </thead>
            <tbody id="rssinfo"></tbody>
        </table>
    </div>

    <!-- Placeholder for Cards or List -->
    <div id="rsscards"></div>

</div>
