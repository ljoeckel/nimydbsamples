<div id="container" class="card" data-signals="{formId: 'tb', sort:'time', format:'card', direction:'down'}">
    <style>
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            /* Ermöglicht Umbruch auf Mobilgeräten */
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: #eaf2a6;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .search-group {
            display: flex;
            flex: 1 1 300px;
            /* Suchfeld wächst, bricht aber ab 300px um */
            gap: 4px;
        }

        .search-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .action-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 8px;
            color: black;
            background: #9fb5f1;
            border: 1px solid #3a096b;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            color: white;
            background: #334eea;
        }

        .btnhover {
            color: white;
            background: #334eea;
        }

        /* Responsive Anpassung für kleine Screens */
        @media (max-width: 600px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .action-group {
                justify-content: space-between;
            }

            .divider {
                display: none;
            }
        }
    </style>

    <div class="toolbar" id="main_toolbar">
        <!-- Suchbereich -->
        <div class="search-group">
            <!-- Keyword -->
            <input id="keyword" data-bind:keyword data-on:input__debounce.500ms="@post('/search')" placeholder="Search for xxxx ..." autofocus type="text" />

            <select 
                    id="articles" 
                    name="articles" 
                    data-bind:articles
                    autocomplete="articles"
                    data-on:change__delay.100ms="@post('/search')">
                    <option value="100" selected>100</option>
                    <option>25</option>
                    <option>50</option>
                    <option>75</option>
                    <option>100</option>
                    <option>150</option>
                    <option>250</option>
                    <option>500</option>
                </select>
        </div>

        <div class="divider" style="width: 1px; height: 20px; background: #ddd;"></div>

        <!-- Sortierung & Ansicht -->
        <div class="action-group">
            <!-- Zeit-Sortierung mit Richtungs-Indikator -->
            <button class="btn" title="Time" data-class:btnhover="$sort == 'time'" data-on:click="$sort='time'; @post('/search')">
                <i class="bi bi-calendar-week"></i>
            </button>

            <button class="btn" title="Today" data-class:btnhover="$sort == 'today'" data-on:click="$sort='today'; @post('/search')">
                <i class="bi bi-calendar-event"></i>
            </button>

            <!-- Relevanz -->
            <button class="btn" title="Relevance" data-class:btnhover="$sort == 'relevance'" data-on:click="$sort='relevance'; @post('/search')">
                <i class="bi bi-graph-down"></i>
            </button>

            <div style="width: 6px;"></div>

            <!-- Ansicht-Formate -->
            <button class="btn" title="Cards" data-class:btnhover="$format == 'card'" data-on:click="$format='card'; @post('/search')">
                <i class="bi bi-postcard"></i>
            </button>
            <button class="btn" title="List" data-class:btnhover="$format == 'list'" data-on:click="$format='list'; @post('/search')">
                <i class="bi bi-list"></i>
            </button>

            <div style="width: 6px;"></div>

            <!-- Sort -->
            <button class="btn" title="Sort ascending" data-class:btnhover="$direction == 'up'" data-on:click="$direction='up'; @post('/search')">
                <i class="bi bi-sort-up"></i>
            </button>
            <button class="btn" title="Sort descending" data-class:btnhover="$direction == 'down'" data-on:click="$direction='down'; @post('/search')">
                <i class="bi bi-sort-down-alt"></i>
            </button>

        </div>
    </div>

    <div id="livefeed">
        <div id="rsscard" class="rsscard-container"> </div>
    </div>
