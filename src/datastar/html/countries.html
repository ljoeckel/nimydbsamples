<div id="container" class="card" data-signals="{formId: 'countries'}">
    <div class="header">
        <h1>Countries</h1>
    </div>

    <form class="form" data-on:submit__prevent="@post('/submit-country')">
        <country-name data-ignore-morph></country-name>
        <country-code data-ignore-morph></country-code>
        <country-prefix data-ignore-morph></country-prefix>

        <!-- Buttons -->
        <div class="actions full">
            <button class="btn" type="submit" data-attr:disabled="!$canSubmit">Submit</button>
            <button class="btn btn-secondary" type="button" data-on:click="@get('/clear-form')">Clear</button>
            <!-- Response from server is here -->
            <div id="response-message"></div>
        </div>

    </form>

</div>
