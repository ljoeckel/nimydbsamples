<!DOCTYPE html>
<html>

<head data-init="@get('/update-clock')">
    <meta charset="UTF-8">
    <script type="module"
        src="https://cdn.jsdelivr.net/gh/starfederation/datastar@1.0.0-RC.8/bundles/datastar.js"></script>
    <link rel="stylesheet" href="/reset.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/table.css">
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="formfields.js"></script>
    <script src="formfields_country.js"></script>
    <script src="helpers.js"></script>

</head>

<body
    data-signals="{formId: '', lastFormId: '', name: '', email: '', emailInvalid: false, password: '', message: '', country: '', plan: 'starter', status: '', canSubmit: true, terms: false, menuOpen: false, id: '', page: 0}">
    <!-- The navigation menu -->
    <div class="navbar">
        <a href="#home" id="home" data-on:click="@get('goto/form.html')">Registration</a>

        <div class="subnav" data-on:mouseenter="$menuOpen = true" data-on:mouseleave="$menuOpen = false">
            <button class="subnavbtn">Administration<i class="fa fa-caret-down"></i></button>
            <div class="subnav-content" data-class="{'force-closed': !$menuOpen}">
                <a href="#admin" data-on:click="$menuOpen = false; @get('goto/admin.html')">Edit Registrations</a>
                <a href="#countries" data-on:click="$menuOpen = false; @get('goto/countries.html')">Countries</a>
            </div>
        </div>

        <div class="subnav">
            <button class="subnavbtn">Technologies<i class="fa fa-caret-down"></i></button>
            <div class="subnav-content">
                <a href="https://data-star.dev/">Datastar</a>
                <a href="https://nim-lang.org">Nim</a>
                <a href="https://yottadb.com">YottaDB</a>
                <a href="https://icons.getbootstrap.com/">bootstrap icons</a>
            </div>
        </div>

        <a href="#about" data-on:click="$menuOpen = false; @get('/about.html')">About</a>

        <h3 id="wallclock"></h3>
    </div>

    <!-- Load the form.html page -->
    <div id="container" class="card" data-init="@get('/form.html')"></div>

</body>

</html>
